server.port=${PORT:8080}
# Bind to all interfaces — critical on PaaS platforms (Runsite, Heroku, etc.)
# where the runtime proxy connects from outside the container's network namespace.
server.address=0.0.0.0

# Reduce Tomcat memory footprint for 256MB container
server.tomcat.threads.max=5
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=50
server.tomcat.accept-count=10

# Default datasource: H2 in-memory (PostgreSQL compatibility mode).
# Used when no profile is set OR when DATABASE_URL is not provided.
# On Runsite (prod profile + DATABASE_URL set), DataSourceConfig overrides
# this with a PostgreSQL DataSource via HikariCP, and Spring Boot backs off.
spring.datasource.url=jdbc:h2:mem:ats;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver

# DO NOT set hibernate.dialect here — Hibernate 6+ auto-detects it from the
# connection metadata. An explicit H2Dialect would crash when the actual
# datasource is PostgreSQL (Runsite prod profile).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Memory optimizations for 256MB container
spring.jmx.enabled=false
spring.main.lazy-initialization=true
spring.data.web.pageable.one-indexed-parameters=false

# Hibernate memory tuning
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false