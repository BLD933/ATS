server.port=${PORT:8080}
server.address=0.0.0.0

# Tomcat: minimal footprint
server.tomcat.threads.max=3
server.tomcat.threads.min-spare=1
server.tomcat.max-connections=20
server.tomcat.accept-count=5

# H2 in-memory
spring.datasource.url=jdbc:h2:mem:ats;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver

# SQL init runs when DataSource is created (lazy — only on first JPA access)
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

# CRITICAL: lazy init so health check endpoint starts instantly
# without triggering JPA/Hibernate/DataSource initialization
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=deferred

# Memory and startup optimizations
spring.jmx.enabled=false
spring.data.web.pageable.one-indexed-parameters=false

# Exclude unnecessary auto-configurations
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration,\
  org.springframework.boot.autoconfigure.groovy.template.GroovyTemplateAutoConfiguration,\
  org.springframework.boot.autoconfigure.mustache.MustacheAutoConfiguration,\
  org.springframework.boot.autoconfigure.thymeleaf.ThymeleafAutoConfiguration,\
  org.springframework.boot.autoconfigure.freemarker.FreeMarkerAutoConfiguration,\
  org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration

# Hibernate minimal config (only used when JPA is actually accessed)
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false
