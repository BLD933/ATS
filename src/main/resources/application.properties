server.port=${PORT:8080}
server.address=0.0.0.0

# Tomcat: minimal footprint
server.tomcat.threads.max=3
server.tomcat.threads.min-spare=1
server.tomcat.max-connections=20
server.tomcat.accept-count=5

# Lazy init — health check starts instantly, JPA/DataSource deferred to first request
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=deferred

# JPA — ddl-auto=update creates table on first Hibernate session (fast for H2)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false

# Memory and startup optimizations
spring.jmx.enabled=false
spring.data.web.pageable.one-indexed-parameters=false

# CRITICAL: exclude DataSourceAutoConfiguration — DataSourceConfig handles it with @Lazy
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration,\
  org.springframework.boot.autoconfigure.groovy.template.GroovyTemplateAutoConfiguration,\
  org.springframework.boot.autoconfigure.mustache.MustacheAutoConfiguration,\
  org.springframework.boot.autoconfigure.thymeleaf.ThymeleafAutoConfiguration,\
  org.springframework.boot.autoconfigure.freemarker.FreeMarkerAutoConfiguration,\
  org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration
