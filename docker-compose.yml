services:

  db:
    image: docker.io/postgres:17-alpine
    container_name: ats-db
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: bldmhd/ats-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ats-backend
    ports:
      - "8080:8080"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_USER: ats
      DB_PASSWORD: ats
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
